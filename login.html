<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RSP – Connexion</title>

  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card" aria-labelledby="login-title">

      <div class="login-header">
        <div class="brand">
          <div class="brand-logo">RSP</div>

          <div>
            <h1 id="login-title">Connexion</h1>
            <p>Retractable Solar Panel</p>
          </div>
        </div>

        <button
          type="button"
          class="theme-btn"
          id="themeBtn"
          aria-label="Changer de thème"
          title="Changer de thème"
        >
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>

          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
          </svg>
        </button>
      </div>

      <div class="login-intro">
        <h2>Accéder au tableau de bord</h2>
        <p>
          Connectez-vous pour accéder à la surveillance
          et au contrôle des panneaux solaires.
        </p>
      </div>

      <form
        class="login-form"
        id="loginForm"
        novalidate
        >
        <label for="loginUser">Nom d’utilisateur</label>
        <input type="text" id="loginUser" name="_username" autocomplete="username" placeholder="exemple@domaine.fr" required autofocus>

        <label for="loginPass">Mot de passe</label>
        <input type="password" id="loginPass" name="_password" autocomplete="current-password" placeholder="Votre mot de passe" required>

        <p class="login-error" id="loginError" hidden>Identifiants incorrects.</p>

        <button type="submit" class="login-submit">Se connecter</button>
      </form>

      <div class="login-footer">
        <span class="status-dot"></span>
        <span>Authentification sécurisée</span>
      </div>

    </section>

  </main>

  <script src="js/login.js" defer></script>

</body>
</html>
